{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Login alumnos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{% static 'style.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="contenedor">

        <div class="menu-login">
            <a href="{% url 'login_maestro' %}">Maestro</a>
            <span>|</span>
            <a href="{% url 'login_alumno' %}" class="activo">Alumno</a>
        </div>

        <div class="login">

            <i class="fa-solid fa-arrow-right-to-bracket icon-login"></i>

            <h1 class="acess">Acceso para alumnos</h1>

            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form action="{% url 'login_alumno' %}" method="post" class="formulario">
                {% csrf_token %}

                <label for="matricula" class="label">
                    No. de expediente:
                </label>

                <input type="text" name="username" class="input">

                <label for="password" class="label">
                    Contraseña:
                </label>

                <input type="password" name="password" class="input">

                <button type="submit" class="boton" id="login_alumno">
                    Iniciar sesión
                </button>

            </form>

        </div>

    </div>

    <script src="{% static 'main.js' %}"></script>

</body>

</html>
